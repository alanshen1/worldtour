<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界巡游 World Tour</title>
<meta name="description" content="一场不用操作的飞行：穿过一道道传送门，从一座城市飞到下一座城市。">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23081020' stroke='%239fd0ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/",
  "3d-tiles-renderer": "./vendor/3d-tiles-renderer/index.js", "3d-tiles-renderer/plugins": "./vendor/3d-tiles-renderer/index.plugins.js"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="veil"><div id="veil-title">世界巡游</div><div id="veil-en">WORLD TOUR</div><div id="veil-sub">正在启程…</div></div>
<div id="title"><div id="t-count"></div><div id="t-zh"></div><div id="t-en"></div><div id="t-line"></div></div>
<div id="next"></div>
<div id="hud">
  <button id="b-pause" title="暂停 (空格)" aria-label="暂停">❚❚</button>
  <button id="b-next" title="快进到下一道传送门 (→)" aria-label="快进到下一站">⏭</button>
  <label title="飞行速度">速度<input id="r-pace" type="range" min="0.4" max="2.5" step="0.05" value="1" aria-label="飞行速度"></label>
  <button id="b-mode" title="切换画面模式：矢量精模 / Google 实景航拍 (M)" aria-label="切换画面模式">矢量精模</button>
  <button id="b-list" title="选择城市 (I)" aria-label="选择城市">城市</button>
  <button id="b-sound" title="声音 (S)" aria-label="声音">♪</button>
  <button id="b-full" title="全屏 (F)" aria-label="全屏">⛶</button>
</div>
<div id="menu" hidden><div id="cities"></div></div>
<div id="credits" hidden></div>
<div id="keybox" hidden>
  <form id="key-form">
    <h2>需要一个访问 token</h2>
    <p>城市画面来自 Google 写实 3D 瓦片。填一个 Cesium ion 的 access token（在 ion.cesium.com 免费注册即可，不用信用卡），或一个开通了 Map Tiles API 的 Google key。它只保存在这台设备的浏览器里。</p>
    <label for="key-input">Cesium ion token 或 Google key</label>
    <input id="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="eyJ…  或  AIza…">
    <button type="submit">开始飞行</button>
    <p id="key-msg" role="status"></p>
  </form>
</div>
<script type="module" src="./src/main.js"></script>
<script nomodule>document.getElementById('veil-sub').textContent = '这个浏览器太旧了，无法显示';</script>
</body>
</html>
